services:
  xhs:
    build:
      context: .
      dockerfile: Dockerfile
    image: xhs-downloader:latest
    container_name: xhs-downloader
    restart: unless-stopped
    ports:
      # 宿主机:容器   改成 "80:3001" 可直接通过 http://服务器/ 访问
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      ADMIN_TOKEN: ${ADMIN_TOKEN:?请在 .env 里设置 ADMIN_TOKEN}
      XHS_COOKIE_STORE_PATH: /app/runtime/xhs-cookie.json
      # CORS：同源访问用不到；如需跨域前端，用逗号分隔
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001}
      # MediaCrawler 跑在宿主机 → 通过 host.docker.internal 访问
      MEDIACRAWLER_API: ${MEDIACRAWLER_API:-http://host.docker.internal:8080}
      # 容器内路径：由下方 volumes 挂载到宿主机的真实位置
      MEDIACRAWLER_BROWSER_DATA: /mnt/mediacrawler/browser_data/xhs_user_data_dir
      MEDIACRAWLER_DATA_DIR: /mnt/mediacrawler/data
      # 其他可选调参（见 backend/.env.example）
      MEDIACRAWLER_CONCURRENCY: ${MEDIACRAWLER_CONCURRENCY:-1}
      RESULT_CACHE_TTL_MS: ${RESULT_CACHE_TTL_MS:-300000}
      RUNTIME_DATA_RETENTION_DAYS: ${RUNTIME_DATA_RETENTION_DAYS:-3}
      RUNTIME_DATA_MAX_JSON_FILES: ${RUNTIME_DATA_MAX_JSON_FILES:-200}
      RUNTIME_CLEANUP_INTERVAL_MS: ${RUNTIME_CLEANUP_INTERVAL_MS:-21600000}
    volumes:
      # 管理员 Cookie 运行时存储，不进入镜像和 git，容器重建后保留
      - xhs_runtime:/app/runtime
      # 宿主机上 MediaCrawler 的 browser_data（读写：登录态会被 Chromium 写回）
      - ${MC_HOST_BROWSER_DATA:?请在 .env 里设置 MC_HOST_BROWSER_DATA 指向宿主机 MediaCrawler/browser_data}:/mnt/mediacrawler/browser_data
      # 宿主机上 MediaCrawler 的 data（读写：清理历史数据需要删 JSON）
      - ${MC_HOST_DATA:?请在 .env 里设置 MC_HOST_DATA 指向宿主机 MediaCrawler/data}:/mnt/mediacrawler/data
    # Linux 上必须显式声明，Windows / macOS Docker Desktop 默认已支持
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 健康检查由 Dockerfile 的 HEALTHCHECK 指令负责，这里无需重复

volumes:
  xhs_runtime:

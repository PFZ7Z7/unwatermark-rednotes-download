name: unwatermark-rednotes-download

services:
  xhs:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-slim}
        USE_ALIYUN_APT_MIRROR: ${USE_ALIYUN_APT_MIRROR:-false}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: xhs-downloader:latest
    container_name: xhs-downloader
    restart: unless-stopped
    ports:
      # 生产反代默认只监听本机；如需直接公网访问，设置 XHS_BIND_ADDR=0.0.0.0
      - "${XHS_BIND_ADDR:-127.0.0.1}:${XHS_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      FRONTEND_DIST: /app/frontend-dist
      XHS_COOKIE_STORE_PATH: /app/runtime/xhs-cookie.json
      # 默认连接同一 Compose 项目内的驱动器 sidecar
      MEDIACRAWLER_API: ${MEDIACRAWLER_API:-http://xhs-driver:8080}
      MEDIACRAWLER_BROWSER_DATA: /mnt/mediacrawler/browser_data/xhs_user_data_dir
      MEDIACRAWLER_DATA_DIR: /mnt/mediacrawler/data
      # CORS：同源访问用不到；如需跨域前端，用逗号分隔
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://127.0.0.1:3001}
      # 其他可选调参（见 backend/.env.example）
      APP_API_TOKEN: ${APP_API_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      MEDIACRAWLER_CONCURRENCY: ${MEDIACRAWLER_CONCURRENCY:-1}
      RESULT_CACHE_TTL_MS: ${RESULT_CACHE_TTL_MS:-300000}
      RUNTIME_DATA_RETENTION_DAYS: ${RUNTIME_DATA_RETENTION_DAYS:-3}
      RUNTIME_DATA_MAX_JSON_FILES: ${RUNTIME_DATA_MAX_JSON_FILES:-200}
      RUNTIME_CLEANUP_INTERVAL_MS: ${RUNTIME_CLEANUP_INTERVAL_MS:-21600000}
      ZIP_COMPRESSION_LEVEL: ${ZIP_COMPRESSION_LEVEL:-3}
      DOWNLOAD_JOB_TTL_MS: ${DOWNLOAD_JOB_TTL_MS:-1800000}
      DOWNLOAD_JOB_MAX_JOBS: ${DOWNLOAD_JOB_MAX_JOBS:-50}
    volumes:
      # 共享 Cookie 运行时存储，不进入镜像和 git，容器重建后保留
      - xhs_runtime:/app/runtime
      # 与驱动器共用浏览器登录态和输出数据
      - xhs_driver_browser_data:/mnt/mediacrawler/browser_data
      - xhs_driver_data:/mnt/mediacrawler/data
    depends_on:
      xhs-driver:
        condition: service_healthy
    # Linux 上如果 MEDIACRAWLER_API 覆盖为 host.docker.internal，需要显式声明
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  xhs-driver:
    build:
      context: .
      dockerfile: docker/driver/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim-bookworm}
        USE_ALIYUN_APT_MIRROR: ${USE_ALIYUN_APT_MIRROR:-false}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PLAYWRIGHT_DOWNLOAD_HOST: ${PLAYWRIGHT_DOWNLOAD_HOST:-}
        MEDIACRAWLER_REPO: ${MEDIACRAWLER_REPO:-https://github.com/NanmiCoder/MediaCrawler.git}
        MEDIACRAWLER_REF: ${MEDIACRAWLER_REF:-165776886faf56d44651d4dbd290b015582a97f2}
    image: xhs-driver:latest
    container_name: xhs-driver
    # Run Docker's tiny init as PID 1 so orphaned browser subprocesses are reaped.
    init: true
    restart: unless-stopped
    volumes:
      - xhs_driver_browser_data:/app/MediaCrawler/browser_data
      - xhs_driver_data:/app/MediaCrawler/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  xhs_runtime:
    name: xhs_downloader_runtime
  xhs_driver_browser_data:
    name: xhs_driver_browser_data
  xhs_driver_data:
    name: xhs_driver_data
